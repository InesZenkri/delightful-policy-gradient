name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      # CPU-only torch wheel: the default PyPI wheel pulls gigabytes of CUDA
      # libraries this repo never uses. Install torch first so requirements see it satisfied.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-test.txt
      - run: ruff check .
      - run: PYTHONPATH=. pytest -q --cov=dgplay --cov-report=term-missing
